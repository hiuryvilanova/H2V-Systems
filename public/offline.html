<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — H2V Systems</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(ellipse at top, #1a1310 0%, #0a0a0a 60%);
        color: #fafaf9;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 460px;
        padding: 2.5rem 2rem;
        background: rgba(20, 17, 14, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #fb923c;
        background: rgba(234, 88, 12, 0.1);
        border: 1px solid rgba(234, 88, 12, 0.35);
        padding: 0.4rem 0.85rem;
        border-radius: 999px;
        margin-bottom: 1.5rem;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #fb923c; box-shadow: 0 0 12px #fb923c; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 0.75rem; }
      p { color: #a1a1aa; font-size: 0.95rem; line-height: 1.65; margin: 0 0 1.5rem; }
      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, #ea580c, #c2410c);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 20px rgba(234, 88, 12, 0.35);
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(234, 88, 12, 0.5); }
      button:active { transform: translateY(0); }
      small { display: block; margin-top: 1.5rem; color: #71717a; font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge"><span class="dot"></span>Sem conexão</span>
      <h1>Você está offline</h1>
      <p>Não conseguimos carregar esta página agora. Verifique sua conexão e tente novamente — o conteúdo já visitado continua disponível em cache.</p>
      <button onclick="location.reload()">Tentar novamente</button>
      <small>H2V Systems · Engenharia de Precisão</small>
    </main>
  </body>
</html>
